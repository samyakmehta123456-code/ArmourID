<svg width="1200" height="1200" viewBox="0 0 1200 1200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    {/* Soft Platinum Silk Base Gradient */}
    <radialGradient id="silkGlow" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#F8FAFC" />
      <stop offset="70%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </radialGradient>

    {/* Luxury Metallic Gold Vignette */}
    <radialGradient id="goldVignette" cx="20%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0" />
    </radialGradient>

    {/* Deep Emerald Trust Vignette */}
    <radialGradient id="emeraldVignette" cx="85%" cy="90%" r="65%">
      <stop offset="0%" stop-color="#047857" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0" />
    </radialGradient>
  </defs>

  {/* Silk Canvas Base */}
  <rect width="1200" height="1200" fill="url(#silkGlow)" />
  <rect width="1200" height="1200" fill="url(#goldVignette)" />
  <rect width="1200" height="1200" fill="url(#emeraldVignette)" />

  {/* High-End Banknote Guilloche Security Ribbons */}
  <g stroke="#0F172A" stroke-opacity="0.03" stroke-width="0.8" fill="none">
    {/* Interlocking Math Curvature Ribbons */}
    <path d="M-100,200 Q200,50 500,250 T1100,100 T1500,300" />
    <path d="M-100,220 Q200,70 500,270 T1100,120 T1500,320" />
    <path d="M-100,240 Q200,90 500,290 T1100,140 T1500,340" />
    <path d="M-100,260 Q200,110 500,310 T1100,160 T1500,360" />
    <path d="M-100,280 Q200,130 500,330 T1100,180 T1500,380" />

    <path d="M-100,600 Q300,400 700,650 T1300,500" />
    <path d="M-100,620 Q300,420 700,670 T1300,520" />
    <path d="M-100,640 Q300,440 700,690 T1300,540" />
    <path d="M-100,660 Q300,460 700,710 T1300,560" />

    <path d="M-100,1000 Q400,800 800,1050 T1400,900" />
    <path d="M-100,1020 Q400,820 800,1070 T1400,920" />
    <path d="M-100,1040 Q400,840 800,1090 T1400,940" />
  </g>

  {/* Subtle Gold Geometric Security Concentric Rings */}
  <g stroke="#D4AF37" stroke-opacity="0.04" stroke-width="1" fill="none">
    <circle cx="200" cy="150" r="180" stroke-dasharray="4 6" />
    <circle cx="200" cy="150" r="260" />
    <circle cx="1000" cy="950" r="220" stroke-dasharray="6 8" />
    <circle cx="1000" cy="950" r="320" />
  </g>
</svg>
